<style>
:root{--celeste:#1798D5;--gris:#656666;--azul:#0C3B51;--verde:#52C5B4;--linea:#E6EAED;--fondo:#F3F5F7;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--fondo);font-family:Poppins,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--azul);-webkit-font-smoothing:antialiased}
.card{max-width:440px;margin:0 auto;background:#fff;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
@media (min-width:520px){.card{margin:32px auto;min-height:auto;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px -20px rgba(12,59,81,.35)}}
.hero{position:relative;background:var(--azul);color:#fff;padding:calc(24px + env(safe-area-inset-top,0px)) 28px 66px;overflow:hidden}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-1px;height:70px;background:#fff;clip-path:polygon(0 100%,100% 18%,100% 100%)}
.hero .slash{position:absolute;right:-40px;top:-30px;width:150px;height:300px;background:linear-gradient(160deg,var(--celeste),rgba(23,152,213,0));transform:skewX(-30deg);opacity:.55}
.iso{width:30px;height:auto;position:relative;filter:brightness(0) invert(1);opacity:.9}
.name{position:relative;margin:14px 0 4px;font-weight:600;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.role{position:relative;margin:0;font-weight:500;font-size:16px;color:#8FD0F0}
.org{position:relative;margin:2px 0 0;font-size:14px;color:rgba(255,255,255,.72)}
.photo{position:relative;z-index:2;width:112px;height:112px;margin:-72px 28px 0 auto;border-radius:22px;background:#fff;padding:5px;box-shadow:0 10px 30px -12px rgba(12,59,81,.5)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:17px}
.body{padding:4px 28px 4px;flex:1}
.pitch{margin:-14px 128px 16px 0;font-size:13px;line-height:1.5;color:var(--gris)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 20px;border:0;border-radius:14px;background:var(--celeste);color:#fff;font:600 17px/1 Poppins,"Segoe UI",sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 10px 24px -10px rgba(23,152,213,.8);transition:transform .15s,background .15s}
.cta:hover{background:#1186BE} .cta:active{transform:scale(.98)}
.cta svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{margin:8px 0 14px;text-align:center;font-size:12px;color:var(--gris)}
.list{border-top:1px solid var(--linea)}
.row{display:flex;align-items:center;gap:14px;padding:8px 4px;border-bottom:1px solid var(--linea);text-decoration:none;color:inherit}
.row:hover .vl{color:var(--celeste)}
.ic{flex:none;width:34px;height:34px;border-radius:12px;background:#EAF5FB;display:grid;place-items:center;color:var(--celeste)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{display:flex;flex-direction:column;min-width:0;text-decoration:none;color:inherit}
.lb{font-size:12px;color:var(--gris)}
.vl{font-size:15px;font-weight:500;overflow-wrap:anywhere;transition:color .15s}
.tel .vl{white-space:nowrap}
.wa{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;padding:8px 10px;border-radius:12px;background:#EAF5FB;color:var(--celeste);font-size:13px;font-weight:500;text-decoration:none;transition:background .15s,color .15s}
.wa svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wa:hover{background:var(--celeste);color:#fff}
a:focus-visible,.cta:focus-visible{outline:3px solid var(--verde);outline-offset:3px}
footer{padding:10px 28px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--linea)}
footer a{display:block;line-height:0}
footer img{height:34px;width:auto}
footer span{font-size:12px;color:var(--gris);text-align:right}
@media (max-width:370px){.wa span{display:none}}
@media (max-width:360px){.name{font-size:26px}.pitch{margin-right:0;margin-top:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
